[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khurak"
version = "0.1.0"
description = "Catch dangerous Indian-medicine combinations (double paracetamol, two NSAIDs) in chatbot answers and prescriptions."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "onnxruntime>=1.17"]

[project.optional-dependencies]
train = ["torch", "pandas", "pyarrow", "scikit-learn", "google-genai", "mlx-lm"]

[project.scripts]
khurak = "khurak.cli:main"

[tool.setuptools]
packages = ["khurak"]

[tool.setuptools.package-data]
khurak = ["data/*"]
